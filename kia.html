<!DOCTYPE html>
<html>
<head>
<title>Kia Clavis Service Intelligence PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>
body { margin:0; font-family:Segoe UI; background:#081821; color:#fff; }
.header { display:flex; align-items:center; gap:10px; padding:15px; background:#0d2a38; }
.header img { width:55px; border-radius:8px; }

.filters { padding:15px; display:flex; gap:10px; flex-wrap:wrap; }

select, button {
  padding:8px 14px;
  border-radius:25px;
  border:none;
  background:#1c4c5f;
  color:#fff;
  cursor:pointer;
}

.kpi-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:15px;
}

.kpi {
  background:#0f3a4a;
  padding:18px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
}

.grid {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:15px;
  padding:15px;
}

.card {
  background:#0f3a4a;
  padding:15px;
  border-radius:12px;
}

table { width:100%; border-collapse:collapse; }
th,td { padding:10px; border-bottom:1px solid #1e4d60; }
tr:hover { background:#163d50; cursor:pointer; }

</style>
</head>

<body>

<div class="header">
  <img src="IMG_8873.jpeg">
  <h2>Kia Clavis Service Intelligence 🚀</h2>
</div>

<div class="filters">
  <select id="engine"></select>
  <select id="gearbox"></select>
  <select id="variant"></select>
  <select id="year"></select>
  <button onclick="resetSunburst()">Reset Drill</button>
</div>

<div class="kpi-grid">
  <div class="kpi" id="total"></div>
  <div class="kpi" id="avg"></div>
  <div class="kpi" id="max"></div>
  <div class="kpi" id="min"></div>
</div>

<div class="grid">
  <div class="card"><canvas id="line"></canvas></div>
  <div class="card"><div id="sunburst" style="height:350px;"></div></div>
</div>

<div class="grid">
  <div class="card"><canvas id="bar"></canvas></div>
  <div class="card"><canvas id="pie"></canvas></div>
</div>

<div class="card" id="details" style="margin:15px;">Click any year for deep breakdown</div>

<div class="card" style="margin:15px;">
  <table id="table"></table>
</div>

<script>

let rawData=[], charts={};
let activeCategory=null;

// HELPERS
const cleanKey=k=> (k||"").replace(/\n/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
const num=v=> isNaN(Number(v))?0:Number(v);

// LOAD EXCEL
fetch("clavis.xlsx")
.then(res=>res.arrayBuffer())
.then(data=>{
  const wb=XLSX.read(data,{type:'array'});
  const sheet=wb.Sheets[wb.SheetNames[1]];
  const raw=XLSX.utils.sheet_to_json(sheet);

  rawData=raw.map(r=>{
    let obj={};
    Object.keys(r).forEach(k=> obj[cleanKey(k)]=r[k]);

    return {
      engine:obj["ENGINE"],
      gearbox:obj["TRANSMISSION"],
      variant:obj["VARIANT"],
      year:parseInt(obj["INTERVAL"])||0,

      cost:num(obj["GRAND TOTAL"]),
      labour:num(obj["LABOUR CHARGES"]),
      parts:num(obj["SPARE PARTS CHARGES"]),
      cons:num(obj["CONSUMABLE CHARGES"]),

      oil:num(obj["ENGINE OIL"]),
      oilFilter:num(obj["ENGINE OIL FILTER"]),
      air:num(obj["AIR CLEANER FILTER"]),
      fuel:num(obj["FUEL FILTER"]),
      coolant:num(obj["COOLANT (ENGINE)"]),
      brake:num(obj["BRAKE / CLUTCH FLUID"])
    };
  }).filter(d=>d.year>0 && d.cost>0);

  initFilters();
  update();
});

// FILTERS
function initFilters(){
  ["engine","gearbox","variant","year"].forEach(f=>fill(f,f));
}

function fill(id,key){
  let vals=[...new Set(rawData.map(d=>d[key]).filter(Boolean))];
  let el=document.getElementById(id);
  el.innerHTML=`<option value="all">All ${key}</option>`;
  vals.forEach(v=> el.innerHTML+=`<option>${v}</option>`);
  el.onchange=update;
}

// DATA FILTER
function getData(){
  return rawData.filter(d=>
    (engine.value==="all"||d.engine===engine.value)&&
    (gearbox.value==="all"||d.gearbox===gearbox.value)&&
    (variant.value==="all"||d.variant===variant.value)&&
    (year.value==="all"||d.year==year.value)
  );
}

// UPDATE DASHBOARD
function update(){

  let data=getData().sort((a,b)=>a.year-b.year);

  let labels=data.map(d=>"Y"+d.year);
  let values=data.map(d=>d.cost);

  let totalVal=values.reduce((a,b)=>a+b,0);
  let avgVal=Math.round(totalVal/(values.length||1));

  total.innerHTML="Total ₹"+totalVal.toLocaleString();
  avg.innerHTML="Avg ₹"+avgVal.toLocaleString();
  max.innerHTML="Max ₹"+Math.max(...values).toLocaleString();
  min.innerHTML="Min ₹"+Math.min(...values).toLocaleString();

  drawChart("line","line",labels,values);
  drawChart("bar","bar",labels,values);

  drawPie(data);
  drawSunburst(data);

  buildTable(data);
}

// CHART GENERIC
function drawChart(id,type,labels,data){
  if(charts[id]) charts[id].destroy();

  charts[id]=new Chart(document.getElementById(id),{
    type,
    data:{labels,datasets:[{label:"Cost",data}]}
  });
}

// PIE
function drawPie(data){
  let labour=data.reduce((a,b)=>a+b.labour,0);
  let parts=data.reduce((a,b)=>a+b.parts,0);
  let cons=data.reduce((a,b)=>a+b.cons,0);

  if(charts["pie"]) charts["pie"].destroy();

  charts["pie"]=new Chart(document.getElementById("pie"),{
    type:"pie",
    data:{
      labels:["Labour","Parts","Consumables"],
      datasets:[{data:[labour,parts,cons]}]
    }
  });
}

// SUNBURST
function drawSunburst(data){

  let chart=echarts.init(document.getElementById('sunburst'));

  chart.setOption({
    series:{
      type:'sunburst',
      data:[{
        name:'Total',
        children:[
          {
            name:'Labour',
            value:data.reduce((a,b)=>a+b.labour,0)
          },
          {
            name:'Parts',
            value:data.reduce((a,b)=>a+b.parts,0),
            children:[
              {name:'Oil',value:data.reduce((a,b)=>a+b.oil,0)},
              {name:'Filter',value:data.reduce((a,b)=>a+b.oilFilter,0)},
              {name:'Air',value:data.reduce((a,b)=>a+b.air,0)}
            ]
          },
          {
            name:'Consumables',
            value:data.reduce((a,b)=>a+b.cons,0)
          }
        ]
      }]
    }
  });

  chart.off('click');
  chart.on('click',p=>{
    activeCategory=p.name==="Total"?null:p.name;
    update();
  });
}

// TABLE
function buildTable(data){
  let html="<tr><th>Year</th><th>Cost</th></tr>";
  data.forEach(d=>{
    html+=`<tr onclick="showDetails(${d.year})">
    <td>${d.year}</td>
    <td>₹${d.cost.toLocaleString()}</td></tr>`;
  });
  table.innerHTML=html;
}

// DETAILS
function showDetails(year){
  let d=rawData.find(x=>x.year==year);
  if(!d) return;

  details.innerHTML=`
  <h3>Year ${year}</h3>
  <p><b>Total:</b> ₹${d.cost}</p>
  <p><b>Labour:</b> ₹${d.labour}</p>
  <p><b>Parts:</b> ₹${d.parts}</p>
  <p><b>Consumables:</b> ₹${d.cons}</p>
  `;
}

// RESET
function resetSunburst(){
  activeCategory=null;
  update();
}

</script>

</body>
</html>
